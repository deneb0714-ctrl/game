<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Hello World – ドット絵2D回避シューティング。マルチエンディング分岐型アクションゲーム。" />
  <meta name="theme-color" content="#050814" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Hello World</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div id="game-root"></div>
  <!-- Phaser 3 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Base64 Images -->
  <script src="src/title_bg.js"></script>
  <script src="src/title_1x_hello_world.js"></script>
  <script src="src/title_1x_baria.js"></script>
  <script src="src/game_over_img.js"></script>
  <script src="src/title_1x_back.js"></script>
  <script src="src/title_1x_number.js"></script>
  <script src="src/boss1.js"></script>
  <script src="src/boss2.js"></script>
  <script src="src/doctor.js"></script>
  <script src="src/title_bg_glitch.js"></script>
  <script src="src/doctor_stand.js"></script>
  <script src="src/doctor_stand_open.js"></script>
  <script src="src/hero_stand.js"></script>
  <script src="src/hero_stand_blink.js"></script>
  <script src="src/hero_combat_sheet.js"></script>
  <script src="src/hero_gif.js"></script>

  <!-- Game Logic -->
  <script src="src/logic/audio.js?v=2"></script>
  <script src="src/logic/flags.js?v=2"></script>
  <script src="src/logic/endings.js?v=2"></script>
  <script src="src/logic/audio.js?v=3"></script>
  <script src="src/logic/flags.js?v=3"></script>
  <script src="src/logic/endings.js?v=3"></script>
  <script src="src/logic/audio.js?v=4"></script>
  <script src="src/logic/flags.js?v=4"></script>
  <script src="src/logic/endings.js?v=4"></script>
  <script src="src/logic/controls.js?v=6"></script>
  <script src="src/logic/enemies.js?v=6"></script>
  <script src="src/logic/items.js?v=6"></script>
  <script src="src/logic/doctorDirective.js?v=6"></script>

  <!-- Scenes -->
  <script src="src/scenes/BootScene.js?v=6"></script>
  <script src="src/scenes/TitleScene.js?v=6"></script>
  <script src="src/scenes/StoryScene.js?v=6"></script>
  <script src="src/scenes/GameScene.js?v=6"></script>
  <script src="src/scenes/BossScene.js?v=6"></script>
  <script src="src/scenes/EndingScene.js?v=6"></script>

  <!-- Config & Entry -->
  <script src="src/config.js?v=6"></script>
  <script src="src/main.js?v=6"></script>

  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
