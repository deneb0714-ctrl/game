  <script>
    // 全画面表示（フルスクリーン）切り替え
    window.toggleGameFullscreen = function() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        let elem = document.documentElement;
        let req = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.msRequestFullscreen;
        if (req) {
          req.call(elem).catch(function() {
            alert('【iPhone(iOS)などで全画面にする方法】\nSafariのアドレスバーにある「ぁあ(aA)」をタップして「ツールバーを非表示」を選択するか、ブラウザの下部メニューから「ホーム画面に追加」をしてホーム画面のアイコンから起動すると、アドレスバーの無い完全な全画面でお楽しみいただけます！');
          });
        } else {
          alert('【iPhone(iOS)などで全画面にする方法】\nSafariのアドレスバーにある「ぁあ(aA)」をタップして「ツールバーを非表示」を選択するか、ブラウザの下部メニューから「ホーム画面に追加」をしてホーム画面のアイコンから起動すると、アドレスバーの無い完全な全画面でお楽しみいただけます！');
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    };


    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('SW unregistered');
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) {
            caches.delete(name);
            console.log('Cache deleted:', name);
          });
        });
      }
    });
  </script>
