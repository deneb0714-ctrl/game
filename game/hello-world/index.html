<body>
  <div id="orientation-warning">
    <div class="warning-box">
      <div class="warning-icon">📱 🔄</div>
      <div class="warning-title">【横向きプレイ推奨】</div>
      <div class="warning-text">快適にプレイしていただくため、スマートフォンの画面回転をオンにして横向き（ランドスケープ）にしてお楽しみください。</div>
      <button class="warning-btn" onclick="document.getElementById('orientation-warning').style.display='none'">[ このままプレイする ]</button>
      <div style="margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <button class="warning-btn" style="border-color: #00FF88; color: #00FF88; font-size: 14px; padding: 8px 16px;" onclick="window.toggleGameFullscreen()">[ ⛶ 全画面（フルスクリーン）表示 ]</button>
      </div>
    </div>
  </div>

  <div id="top-right-ui" style="position: fixed; top: 10px; right: 10px; z-index: 999998; opacity: 0.85; display: flex; gap: 8px;">
    <button onclick="document.getElementById('settings-panel').style.display='block'" style="background: rgba(5,8,20,0.85); color: #4FD1FF; border: 1px solid #4FD1FF; border-radius: 4px; padding: 6px 10px; font-family: 'DotGothic16', sans-serif; font-size: 13px; cursor: pointer;">⚙️ 設定</button>
    <button class="mobile-only" onclick="window.toggleGameFullscreen()" style="background: rgba(5,8,20,0.85); color: #00FF88; border: 1px solid #00FF88; border-radius: 4px; padding: 6px 10px; font-family: 'DotGothic16', sans-serif; font-size: 13px; cursor: pointer;">⛶ 全画面</button>
  </div>

  <div id="settings-panel" style="display: none; position: fixed; top: 50px; right: 10px; z-index: 999999; background: rgba(5,8,20,0.95); border: 2px solid #4FD1FF; padding: 20px; color: white; border-radius: 8px; width: 320px; font-family: 'DotGothic16', sans-serif; box-shadow: 0 0 15px rgba(79, 209, 255, 0.3);">
    <h3 style="color: #4FD1FF; margin-bottom: 15px; display: flex; justify-content: space-between;">
      <span>⚙️ 設定</span>
      <span style="cursor: pointer; color: #FF4B6E;" onclick="document.getElementById('settings-panel').style.display='none'">✕</span>
    </h3>
    <div style="margin-top: 15px;">
      <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="setting-special-cutin" checked onchange="if(window.MOT && MOT.Settings) MOT.Settings.specialCutinEnabled = this.checked"> 
        勇者の必殺技演出を有効にする
      </label>
    </div>
    <div style="margin-top: 15px;">
      <label>BGM音量: <span id="bgm-val">100</span>%</label>
      <input type="range" id="setting-bgm" min="0" max="100" value="100" style="width: 100%; margin-top: 5px;" 
        oninput="document.getElementById('bgm-val').innerText=this.value; if(window.MOT && MOT.Settings) { MOT.Settings.bgmVolume = parseInt(this.value); if (window.game && window.game.sound) window.game.sound.volume = MOT.Settings.bgmVolume / 100; }">
    </div>
    <div style="margin-top: 15px;">
      <label>SE音量: <span id="se-val">100</span>%</label>
      <input type="range" id="setting-se" min="0" max="100" value="100" style="width: 100%; margin-top: 5px;"
        oninput="document.getElementById('se-val').innerText=this.value; if(window.MOT && MOT.Settings) MOT.Settings.seVolume = parseInt(this.value);">
    </div>
    <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #4FD1FF;">
      <h4 style="color: #00FF88; margin-bottom: 8px;">📖 操作方法</h4>
      <div id="control-instructions" style="font-size: 13px; line-height: 1.6; color: #E5E7EB; white-space: pre-wrap;"></div>
    </div>
  </div>

  <div id="game-root"></div>
  
  <!-- Phaser 3 from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Game Logic -->
  <script>
    window.GAME_VERSION = 'v594';
  </script>
  <script src="src/logic/audio.js?v=594"></script>
  <script src="src/logic/flags.js?v=594"></script>
  <script src="src/logic/endings.js?v=594"></script>
  <script src="src/logic/controls.js?v=594"></script>
  <script src="src/logic/enemies.js?v=594"></script>
  <script src="src/logic/items.js?v=594"></script>
  <script src="src/logic/doctorDirective.js?v=594"></script>
  <script src="src/logic/specialCutin.js?v=594"></script>

  <!-- Scenes -->
  <script src="src/scenes/BootScene.js?v=594"></script>
  <script src="src/scenes/TitleScene.js?v=594"></script>
  <script src="src/scenes/StoryScene.js?v=594"></script>
  <script src="src/scenes/GameScene.js?v=594"></script>
  <script src="src/scenes/EndingScene.js?v=594"></script>
  <script src="src/scenes/BossScene.js?v=594"></script>

  <!-- Core -->
  <script src="src/config.js?v=594"></script>
  <script src="src/main.js?v=594"></script>

  <script>
    // 全画面表示（フルスクリーン）切り替え
    window.toggleGameFullscreen = function() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        let elem = document.documentElement;
        let req = elem.requestFullscreen || elem.webkitRequestFullscreen || elem.msRequestFullscreen;
        if (req) {
          req.call(elem).catch(function() {
            alert('【iPhone(iOS)などで全画面にする方法】\nSafariのアドレスバーにある「ぁあ(aA)」をタッチして「ツールバーを非表示」を選択するか、ブラウザの下部メニューから「ホーム画面に追加」をしてホーム画面のアイコンから起動すると、アドレスバーの無い全画面でお楽しみいただけます！');
          });
        } else {
          alert('【iPhone(iOS)などで全画面にする方法】\nSafariのアドレスバーにある「ぁあ(aA)」をタッチして「ツールバーを非表示」を選択するか、ブラウザの下部メニューから「ホーム画面に追加」をしてホーム画面のアイコンから起動すると、アドレスバーの無い全画面でお楽しみいただけます！');
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    };

    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('SW unregistered');
          }
        });
      }

      // Initialize control instructions
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const instDiv = document.getElementById('control-instructions');
      if (instDiv) {
        if (isMobile) {
          instDiv.innerText = "【移動】 画面を上下左右にスワイプ\n【シールド】 画面を長押し (ジャストガードで反撃)\n【必殺技】 画面をダブルタップ";
        } else {
          instDiv.innerText = "【移動】 WASDキー または 矢印キー\n【シールド】 スペースキー (ジャストガードで反撃)\n【必殺技】 エンターキー";
        }
      }

      if ('caches' in window) {
        caches.keys().then(function(names) {
          names.forEach(function(name) {
            caches.delete(name);
          });
        });
      }
    });
  </script>
</body>
</html>
