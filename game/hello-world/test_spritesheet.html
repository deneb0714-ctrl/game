<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="src/hero_combat_sheet.js"></script>
</head>
<body>
    <script>
        var config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            scene: {
                preload: preload,
                create: create
            }
        };

        var game = new Phaser.Game(config);

        function preload () {
            this.load.spritesheet('hero_stand_combat', window.HERO_COMBAT_SHEET_B64, {
                frameWidth: window.HERO_COMBAT_FRAME_WIDTH,
                frameHeight: window.HERO_COMBAT_FRAME_HEIGHT
            });
        }

        function create () {
            this.anims.create({
                key: 'hero_combat_anim',
                frames: this.anims.generateFrameNumbers('hero_stand_combat'),
                frameRate: 15,
                repeat: -1
            });
            var sprite = this.add.sprite(400, 300, 'hero_stand_combat');
            sprite.play('hero_combat_anim');
            
            this.add.text(10, 10, 'Width: ' + sprite.width, { fill: '#fff' });
            
            // Check if texture exists
            this.add.text(10, 30, 'Texture Exists: ' + this.textures.exists('hero_stand_combat'), { fill: '#fff' });
        }
    </script>
</body>
</html>
